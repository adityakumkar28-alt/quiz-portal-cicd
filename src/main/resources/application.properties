server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quizdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:rootpassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.build.version=${APP_VERSION:v1.0-local}
